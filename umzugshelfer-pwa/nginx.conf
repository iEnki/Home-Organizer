# Only successful, content-addressed bundle responses are immutable.
# Never cache a missing chunk: it may exist again after an image rollback.
map $status $static_cache_control {
  default "no-store";
  200 "public, max-age=2592000, immutable";
  206 "public, max-age=2592000, immutable";
  304 "public, max-age=2592000, immutable";
}

server {
  listen 80;
  server_name localhost;
  charset utf-8;
  root /usr/share/nginx/html;
  index index.html index.htm;

  # Stable public names (manifests, icons, Background/) must revalidate.
  # ETag / Last-Modified still allow a small 304 response for unchanged files.
  expires off;
  add_header Cache-Control "no-cache" always;

  # Also used by / and by the internal SPA fallback from every client route.
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Build metadata is used locally by verify-build, never by the browser app.
  location = /.vite {
    add_header Cache-Control "no-store" always;
    return 404;
  }
  location ^~ /.vite/ {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  # Keep the existing push worker update policy.
  location = /service-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }

  # Non-hashed public assets revalidate and missing assets remain real 404s.
  location ~* \.(?:css|js|json|jpg|jpeg|gif|png|ico|webp|svg|woff|woff2|ttf|eot)$ {
    try_files $uri =404;
  }

  # Reserved for the bundler's hashed output. Missing files stay real 404s.
  location ^~ /static/ {
    try_files $uri =404;
    add_header Cache-Control $static_cache_control always;
  }
}
